<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>할 일 관리</title>
  <script>
    (function () {
      var saved = localStorage.getItem("todo-app:theme");
      if (saved === "light" || saved === "dark") {
        document.documentElement.setAttribute("data-theme", saved);
      }
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-title">
          <span class="ig-mark" aria-hidden="true"></span>
          <h1 class="wordmark">오늘 할 일</h1>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="다크 모드 전환">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb"></span>
          </span>
        </button>
      </div>

      <form class="add-form" id="add-form">
        <input
          type="text"
          id="todo-input"
          class="todo-input"
          placeholder="할 일을 입력하세요"
          autocomplete="off"
        />
        <select id="category-select" class="category-select">
          <option value="personal">개인</option>
          <option value="work">업무</option>
          <option value="study">공부</option>
        </select>
        <button type="submit" class="add-btn" id="add-btn" disabled>추가</button>
      </form>
    </header>

    <section class="progress" id="progress">
      <div class="story-bar" id="story-bar"></div>
      <div class="progress-numbers">
        <span id="progress-count">0 / 0</span>
        <span id="progress-percent">0%</span>
      </div>
      <div class="progress-breakdown" id="progress-breakdown"></div>
    </section>

    <nav class="filters" id="filters">
      <div class="filter-buttons">
        <button class="filter-btn is-active" data-filter="all">전체</button>
        <button class="filter-btn" data-filter="work">업무</button>
        <button class="filter-btn" data-filter="personal">개인</button>
        <button class="filter-btn" data-filter="study">공부</button>
      </div>
      <button type="button" class="reset-all-btn" id="reset-all-btn">전체 초기화</button>
    </nav>

    <main>
      <ul class="todo-list" id="todo-list">
        <!-- 할 일 항목이 여기에 렌더링됩니다 -->
      </ul>
      <div class="empty-state" id="empty-state">
        <span class="empty-icon" aria-hidden="true"></span>
        <p>아직 할 일이 없습니다. 위에서 추가해보세요.</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
